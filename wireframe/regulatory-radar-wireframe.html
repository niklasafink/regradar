<meta charset="utf-8">
<title>Regulatory Radar Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#E9EBE8; --paper:#F4F5F2; --surface:#FDFDFC;
  --line:#C4C8C2; --line-soft:#DCDFD9; --fill:#E2E5E0;
  --ink:#1A1E1C; --muted:#6C7370; --faint:#9AA19D;
  --anno:#2C5C86; --anno-soft:#DFE8F1;
  --flag:#9C4A2C; --flag-soft:#F1E3DD;
  --radius:3px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#111413; --paper:#181C1A; --surface:#1F2422;
    --line:#3A403D; --line-soft:#2C312F; --fill:#262B29;
    --ink:#E4E7E4; --muted:#949B97; --faint:#6B726E;
    --anno:#87B4DA; --anno-soft:#1E2C38;
    --flag:#D2907A; --flag-soft:#33221C;
  }
}
:root[data-theme="dark"]{
  --ground:#111413; --paper:#181C1A; --surface:#1F2422;
  --line:#3A403D; --line-soft:#2C312F; --fill:#262B29;
  --ink:#E4E7E4; --muted:#949B97; --faint:#6B726E;
  --anno:#87B4DA; --anno-soft:#1E2C38;
  --flag:#D2907A; --flag-soft:#33221C;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--anno);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

.wrap{max-width:1060px;margin:0 auto;padding:0 26px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* ---- prototype strip ---- */
.proto{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:7px 26px;background:var(--flag-soft);border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--flag);
}
.proto .grow{flex:1}
.toggle{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.toggle button{padding:3px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---- app header ---- */
.appbar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.appbar .inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo .mark{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:50%;position:relative;flex:0 0 auto}
.logo .mark::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--ink)}
.grow{flex:1;min-width:0}

/* ---- primitives ---- */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 7px;
  border:1px solid var(--line);border-radius:2px;background:var(--surface);
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}
.chip.solid{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.new{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.chip.anno{border-color:var(--anno);color:var(--anno);background:var(--anno-soft)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 15px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  font-size:13.5px;line-height:1.2;
}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.btn.primary:hover{opacity:.87}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.ghost{border-style:dashed;color:var(--muted)}
.lbl{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---- page 1 : hero ---- */
.hero{padding:56px 0 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
@media (max-width:640px){.hero{padding:34px 0 22px}}
.hero .eyebrow{display:inline-flex;gap:8px;align-items:center}
.hero h1{
  margin:0;font-size:clamp(28px,4.6vw,44px);line-height:1.1;
  letter-spacing:-.032em;font-weight:600;max-width:19ch;text-wrap:balance;
}
.hero p{margin:0;max-width:60ch;font-size:16px;color:var(--muted)}
.hero .facts{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.hero .facts div{display:flex;flex-direction:column;gap:1px}
.hero .facts b{font-size:19px;font-weight:600;letter-spacing:-.02em}

.pickhead{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin:36px 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);
}
.pickhead h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-bottom:56px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{
  display:flex;flex-direction:column;gap:7px;align-items:flex-start;text-align:left;
  padding:17px 18px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);transition:border-color .12s,transform .12s;
}
.tile:hover{border-color:var(--ink);transform:translateY(-1px)}
.tile b{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.tile .sub{font-size:12.5px;color:var(--muted);line-height:1.45}
.tile .meta{margin-top:auto;padding-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.tile .arrow{
  position:absolute;font-family:var(--mono);font-size:12px;color:var(--faint);
}

/* ---- page 2 : board ---- */
.board{padding:20px 0 70px}
.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filterbar{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  padding:11px 14px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);margin-bottom:16px;
}
.fchip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px;
  border:1px solid var(--anno);background:var(--anno-soft);border-radius:2px;
  font-size:12px;color:var(--ink);
}
.fchip button{font-family:var(--mono);font-size:11px;color:var(--anno);line-height:1}

.topicnav{
  display:flex;gap:7px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:20px;
  border-bottom:1px dashed var(--line);
}
.tnav{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;
  border:1px solid var(--line-soft);border-radius:var(--radius);
  background:var(--surface);font-size:13px;color:var(--muted);
}
.tnav:hover{border-color:var(--line);color:var(--ink)}
.tnav[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tnav .n{font-family:var(--mono);font-size:10.5px;opacity:.7}

.topic{margin-bottom:34px;scroll-margin-top:70px}
.topic > h2{
  margin:0 0 3px;font-size:17px;font-weight:600;letter-spacing:-.018em;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
}
.topic > h2 .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.topic > p{margin:0 0 13px;font-size:13px;color:var(--muted);max-width:72ch}

.fw{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;
}
.fw.fresh{border-left:3px solid var(--ink)}
.fwhead{
  display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 16px;
}
.fwhead:hover{background:var(--paper)}
.fwhead .ttl{flex:1;min-width:0}
.fwhead h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.fwhead .ref{font-family:var(--mono);font-size:10.5px;color:var(--faint);display:block;margin-top:3px}
.fwhead .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.fwhead .last{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fwhead .caret{font-family:var(--mono);font-size:11px;color:var(--faint)}

.updates{border-top:1px solid var(--line-soft);padding:4px 16px 14px}
.upd{display:flex;gap:14px;padding:13px 0;border-bottom:1px dashed var(--line-soft)}
.upd:last-child{border-bottom:0}
@media (max-width:600px){.upd{flex-direction:column;gap:6px}}
.upd .when{
  flex:0 0 74px;font-family:var(--mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;padding-top:2px;
}
.upd .body{flex:1;min-width:0}
.upd h4{margin:0 0 4px;font-size:13.8px;font-weight:600;line-height:1.35}
.upd p{margin:0;font-size:12.8px;color:var(--muted);line-height:1.5;max-width:78ch}
.upd .foot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
.src{
  display:inline-flex;align-items:center;gap:6px;padding:3px 8px;
  border:1px solid var(--line-soft);border-radius:2px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);text-decoration:none;
}
.src:hover{border-color:var(--ink);color:var(--ink)}
.src .ext{font-size:9px;opacity:.7}

.timeline{position:relative;padding-left:15px;margin-top:2px}
.timeline::before{
  content:"";position:absolute;left:3px;top:16px;bottom:16px;width:1px;background:var(--line-soft);
}
.timeline .upd{position:relative}
.timeline .upd::before{
  content:"";position:absolute;left:-15px;top:19px;width:7px;height:7px;
  border-radius:50%;background:var(--surface);border:1.5px solid var(--line);
}
.timeline .upd.hot::before{background:var(--ink);border-color:var(--ink)}

.more{
  display:block;width:100%;text-align:left;padding:9px 0 2px;
  font-family:var(--mono);font-size:11px;color:var(--anno);letter-spacing:.04em;
}
.empty{
  padding:28px 18px;text-align:center;border:1px dashed var(--line);
  border-radius:var(--radius);color:var(--muted);font-size:13.5px;
}

/* ---- modal ---- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(20,24,22,.42);
  display:grid;place-items:center;padding:20px;backdrop-filter:blur(1.5px);
}
.modal{
  width:min(580px,100%);max-height:min(88vh,700px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:5px;
  box-shadow:0 18px 44px rgba(20,24,22,.22);overflow:hidden;
}
.mhead{padding:15px 20px 12px;border-bottom:1px solid var(--line-soft)}
.mbody{padding:18px 20px;overflow-y:auto;flex:1}
.mfoot{
  padding:13px 20px;border-top:1px solid var(--line-soft);background:var(--paper);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.progress{display:flex;gap:3px;margin-bottom:11px}
.progress i{height:3px;flex:1;background:var(--fill);border-radius:2px;display:block}
.progress i.done{background:var(--ink)}
.progress i.now{background:var(--anno)}
.mhead h2{margin:6px 0 0;font-size:17px;font-weight:600;letter-spacing:-.018em;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:7px}
.opts.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:520px){.opts.two{grid-template-columns:1fr}}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:10px 12px;background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--radius);font-size:13.5px;
}
.opt:hover{border-color:var(--line);background:var(--paper)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--paper)}
.opt .tick{flex:0 0 auto;width:15px;height:15px;margin-top:2px;border:1.5px solid var(--line);background:var(--surface)}
.opt.radio .tick{border-radius:50%}
.opt[aria-pressed="true"] .tick{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.opt .hint{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.why{
  margin-top:14px;padding:9px 12px;border-left:2px solid var(--anno);background:var(--anno-soft);
  border-radius:0 var(--radius) var(--radius) 0;font-size:12.5px;
}
.why b{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--anno);margin-bottom:3px;font-weight:500;
}
.livecount{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---- Karte als Ganzes klickbar + Update-Vorschau ---- */
.fwcard{
  display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--radius);
  margin-bottom:10px;padding:0;transition:border-color .12s;
}
.fwcard:hover{border-color:var(--ink)}
.fwcard.fresh{border-left:3px solid var(--ink)}
.peek{display:block;border-top:1px solid var(--line-soft);padding:9px 16px 12px}
.pk{display:flex;gap:11px;align-items:baseline;padding:4px 0;font-size:12.7px;min-width:0}
.pk .when{flex:0 0 66px;font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.pk .pt{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.golink{display:inline-block;margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--anno);letter-spacing:.04em}
.fwcard:hover .golink{text-decoration:underline}

/* ---- Detailseite ---- */
.detail{padding:20px 0 70px}
.back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);margin-bottom:16px}
.back:hover{color:var(--ink)}
.dhead{padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.dhead h1{margin:9px 0 6px;font-size:clamp(21px,3vw,29px);font-weight:600;letter-spacing:-.026em;line-height:1.18;text-wrap:balance;max-width:24ch}
.dhead .ref{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.dhead .about{margin:12px 0 0;font-size:14.5px;color:var(--muted);max-width:70ch;line-height:1.6}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.stats div{display:flex;flex-direction:column;gap:1px}
.stats b{font-size:16px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:30px;align-items:start}
@media (max-width:840px){.dcols{grid-template-columns:minmax(0,1fr)}}
.sidebox{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 15px;margin-bottom:12px}
.sidebox h3{margin:0 0 9px;font-size:12px;font-weight:600}
.sidelink{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.sidelink:last-child{border-bottom:0}
.sidelink:hover{color:var(--anno)}
.sidelink .d{font-family:var(--mono);font-size:10px;color:var(--faint);flex:0 0 auto}
</style>

<div class="proto">
  <span id="proto-txt"></span>
  <span class="grow"></span>
  <div class="toggle" role="group" aria-label="Language">
    <button type="button" data-lang="de" aria-pressed="true">DE</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</div>

<div id="app"></div>
<div id="modal-root"></div>

<script>
"use strict";

/* ============================================================
   STATE
   ============================================================ */
const state = {
  lang: "de",
  provider: null,      // gewählter Anbietertyp (Seite 1)
  topics: [],          // aktive Themenbereiche, leer = alle (Mehrfachauswahl)
  fw: null,            // geöffnetes Rahmenwerk -> Detailseite
  modal: false,
  step: 0,
  q: null              // Fragebogen-Antworten, null = noch nicht ausgefüllt
};
const TODAY = new Date(2026, 7, 24);   // 24.08.2026 – Bezugsdatum der Beispieldaten
const L  = () => state.lang;
const tx = o => (o && typeof o === "object" && !Array.isArray(o)) ? (o[L()] ?? o.de) : o;
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const dt = d => { const [D,M,Y] = d.split("."); return new Date(+Y, +M-1, +D); };
const daysAgo = d => Math.round((TODAY - dt(d)) / 86400000);

/* ============================================================
   ANBIETERTYPEN  (Seite 1)
   ============================================================ */
const PROVIDERS = [
  { id:"CI", n:{de:"Bank / Kreditinstitut",en:"Bank / credit institution"},
    s:{de:"Einlagen- und Kreditgeschäft nach KWG und CRR",en:"Deposit-taking and lending under KWG and CRR"},
    tags:["CRR III","MaRisk","DORA","AMLA"] },
  { id:"AM", n:{de:"Asset Manager / KVG",en:"Asset manager / fund manager"},
    s:{de:"AIF- oder OGAW-Verwaltung nach KAGB",en:"AIF or UCITS management under KAGB"},
    tags:["AIFMD II","SFDR","ELTIF 2.0","DORA"] },
  { id:"IF", n:{de:"Wertpapierinstitut",en:"Investment firm"},
    s:{de:"Wertpapierdienstleistungen nach WpIG und MiFID II",en:"Investment services under WpIG and MiFID II"},
    tags:["MiFID II","IFR/IFD","MAR","DORA"] },
  { id:"PI", n:{de:"Zahlungs- / E-Geld-Institut",en:"Payment / e-money institution"},
    s:{de:"Zahlungsdienste und E-Geld nach ZAG",en:"Payment services and e-money under ZAG"},
    tags:["PSD3/PSR","Instant Payments","MiCA","AMLA"] },
  { id:"INS", n:{de:"Versicherungsunternehmen",en:"Insurance undertaking"},
    s:{de:"Versicherungsgeschäft nach VAG und Solvency II",en:"Insurance business under VAG and Solvency II"},
    tags:["Solvency II","IDD","SFDR","DORA"] },
  { id:"OTH", n:{de:"Leasing, Factoring, Sonstige",en:"Leasing, factoring, other"},
    s:{de:"Finanzdienstleistungen mit eingeschränkter Erlaubnis",en:"Financial services under a limited licence"},
    tags:["GwG","HinSchG","NIS-2","BGB"] }
];

/* ============================================================
   THEMENBEREICHE
   ============================================================ */
const TOPICS = [
  { id:"ICT", n:{de:"IT & digitale Resilienz",en:"IT & digital resilience"},
    d:{de:"IKT-Risikomanagement, Vorfallmeldung, Auslagerung an IT-Dienstleister, Cybersicherheit.",
       en:"ICT risk management, incident reporting, outsourcing to IT providers, cybersecurity."} },
  { id:"AML", n:{de:"Geldwäscheprävention",en:"Financial crime & AML"},
    d:{de:"Sorgfaltspflichten, Verdachtsmeldungen, wirtschaftlich Berechtigte, Sanktionen.",
       en:"Due diligence, suspicious activity reporting, beneficial ownership, sanctions."} },
  { id:"PRU", n:{de:"Eigenmittel & Aufsichtsrecht",en:"Capital & prudential"},
    d:{de:"Eigenmittel, Liquidität, Risikomessung, Sanierung und Abwicklung.",
       en:"Own funds, liquidity, risk measurement, recovery and resolution."} },
  { id:"GOV", n:{de:"Governance & Auslagerung",en:"Governance & outsourcing"},
    d:{de:"Organisationspflichten, Auslagerungsmanagement, Hinweisgeberschutz, Vergütung.",
       en:"Organisational duties, outsourcing management, whistleblowing, remuneration."} },
  { id:"MKT", n:{de:"Wertpapiergeschäft & Anlegerschutz",en:"Markets & investor protection"},
    d:{de:"Wohlverhaltensregeln, Marktintegrität, Produktinformation, Vertrieb.",
       en:"Conduct rules, market integrity, product disclosure, distribution."} },
  { id:"PAY", n:{de:"Zahlungsverkehr",en:"Payments"},
    d:{de:"Zahlungsdienste, starke Kundenauthentifizierung, Echtzeitzahlungen, Kryptowerte.",
       en:"Payment services, strong customer authentication, instant payments, crypto-assets."} },
  { id:"FND", n:{de:"Fondsregulierung",en:"Fund regulation"},
    d:{de:"Fondsverwaltung, Liquiditätsinstrumente, Verwahrstelle, Produktregime.",
       en:"Fund management, liquidity tools, depositary, product regimes."} },
  { id:"ESG", n:{de:"Nachhaltigkeit",en:"Sustainability"},
    d:{de:"Offenlegung, Taxonomie, Berichterstattung, ESG-Risiken.",
       en:"Disclosure, taxonomy, reporting, ESG risks."} },

function visibleFrameworks(){
  return FRAMEWORKS
    .filter(f => f.ents.includes(state.provider))
    .filter(f => !state.q || !f.cond || f.cond())
    .map(f => ({...f, u:[...f.u].sort((a,b)=> dt(b.d) - dt(a.d))}))
    .sort((a,b)=> dt(b.u[0].d) - dt(a.u[0].d));
}
function topicsWithContent(list){
  return TOPICS
    .map(t => ({...t, fws:list.filter(f => f.topic === t.id)}))
    .filter(t => t.fws.length)
    .sort((a,b)=> dt(b.fws[0].u[0].d) - dt(a.fws[0].u[0].d));
}
function activeFilters(){
  if (!state.q) return [];
  const out = [];
  for (const q of QUESTIONS){
    const v = state.q[q.key];
    if (!v || (Array.isArray(v) && !v.length)) continue;
    const vals = Array.isArray(v) ? v : [v];
    for (const val of vals){
      const o = q.o.find(x => x.v === val);
      if (o) out.push({ k:q.key, v:val, l:tx(o.l) });
    }
  }
  return out;
}

          ${L()==="de"?"Alle Updates chronologisch":"All updates in chronological order"}</h2>
        <p class="small muted" style="margin:0 0 14px;max-width:70ch">${L()==="de"
          ? "Neueste zuerst. Jeder Eintrag verweist auf das Originaldokument der veröffentlichenden Stelle."
          : "Newest first. Every entry links to the original document of the publishing body."}</p>
        <div class="timeline">${ups.map(u => updateRow(u)).join("")}</div>
      </div>

      <aside>
        <div class="sidebox">
          <h3>${L()==="de"?"Auf einen Blick":"At a glance"}</h3>
          <div class="sidelink" style="cursor:default"><span class="d">${L()==="de"?"Thema":"Topic"}</span>
            <span class="grow" style="text-align:right">${tx(t.n)}</span></div>
          <div class="sidelink" style="cursor:default"><span class="d">${L()==="de"?"Gilt für":"Applies to"}</span>
            <span class="grow" style="text-align:right">${f.ents.length} ${L()==="de"?"Anbietertypen":"provider types"}</span></div>
          <div class="sidelink" style="cursor:default"><span class="d">${L()==="de"?"Quellen":"Sources"}</span>
            <span class="grow" style="text-align:right">${[...new Set(ups.map(u=>u.src))].length}</span></div>
        </div>
        ${siblings.length ? `<div class="sidebox">
          <h3>${L()==="de"?"Weiteres zu diesem Thema":"More on this topic"}</h3>
          ${siblings.map(x=>`<button type="button" class="sidelink" data-fw="${x.id}">
            <span class="d">${x.u[0].d}</span><span class="grow">${tx(x.n)}</span></button>`).join("")}
        </div>` : ""}
      </aside>
    </div>
  </div>`;
}

function viewBoard(){
  const p = PROVIDERS.find(x=>x.id===state.provider);
  const list = visibleFrameworks();
  const topics = topicsWithContent(list);
  const shown = state.topics.length ? topics.filter(t=>state.topics.includes(t.id)) : topics;
  const filters = activeFilters();
  const totalU = list.reduce((n,f)=>n+f.u.length,0);

  return `
  <header class="appbar"><div class="wrap inner">
    <button type="button" class="logo" data-home="1"><span class="mark"></span>Regulatory Radar</button>
    <span class="chip solid">${tx(p.n)}</span>
    <button type="button" class="btn sm ghost" data-home="1">${L()==="de"?"ändern":"change"}</button>
    <span class="grow"></span>
    <button type="button" class="btn primary" data-modal="open">
      ${state.q ? (L()==="de"?"Fragebogen anpassen":"Adjust questionnaire")
                : (L()==="de"?"Genauer eingrenzen — 6 Fragen":"Narrow it down — 6 questions")}
    </button>
  </div></header>

  <div class="wrap board">
    <div class="filterbar">
      ${filters.length ? `
        <span class="lbl">${L()==="de"?"Ihre Angaben":"Your answers"}</span>
        ${filters.map(f=>`<span class="fchip">${esc(f.l)}
          <button type="button" data-rmf="${f.k}:${f.v}" aria-label="${L()==="de"?"entfernen":"remove"}">×</button></span>`).join("")}
        <button type="button" class="btn sm ghost" data-reset="1">${L()==="de"?"zurücksetzen":"reset"}</button>
      ` : `
        <span class="small muted">${L()==="de"
          ? "Sie sehen alle Rahmenwerke für Ihren Anbietertyp. Beantworten Sie 6 kurze Fragen, um auf Ihr Haus einzugrenzen."
          : "You are seeing all frameworks for your provider type. Answer 6 short questions to narrow this down to your firm."}</span>
      `}
      <span class="grow"></span>
      <span class="lbl tnum">${list.length} ${L()==="de"?"Rahmenwerke":"frameworks"} · ${totalU} Updates</span>
    </div>

    <nav class="topicnav">
      <button type="button" class="tnav" data-topic="ALL" aria-pressed="${state.topics.length===0}">
        ${L()==="de"?"Alle Themen":"All topics"}<span class="n">${list.length}</span></button>
      ${topics.map(t=>`<button type="button" class="tnav" data-topic="${t.id}" aria-pressed="${state.topics.includes(t.id)}">
        ${tx(t.n)}<span class="n">${t.fws.length}</span></button>`).join("")}
      <span class="lbl" style="align-self:center">${state.topics.length
        ? (L()==="de" ? `${state.topics.length} von ${topics.length} ausgewählt`
                      : `${state.topics.length} of ${topics.length} selected`)
        : (L()==="de" ? "Mehrfachauswahl möglich" : "Multiple selection possible")}</span>
    </nav>

    ${shown.length ? shown.map(t=>`
      <section class="topic" id="t-${t.id}">
        <h2>${tx(t.n)}<span class="cnt">${t.fws.length} ${L()==="de"?"Rahmenwerke":"frameworks"}</span></h2>
        <p>${tx(t.d)}</p>
        ${t.fws.map(frameworkCard).join("")}
      </section>`).join("")
    : `<div class="empty">${L()==="de"
        ? "Für diese Kombination aus Anbietertyp und Angaben sind keine Rahmenwerke hinterlegt. Setzen Sie einzelne Angaben zurück."
        : "No frameworks are recorded for this combination of provider type and answers. Reset individual answers."}</div>`}
  </div>`;
}

/* ============================================================
   RENDER — FRAGEBOGEN-POPUP
   ============================================================ */
function viewModal(){
  if (!state.modal) return "";
  const i = state.step, q = QUESTIONS[i];
  const draft = state.q || {};
  const sel = draft[q.key];
  const on = v => q.multi ? (sel||[]).includes(v) : sel===v;

  // Live-Vorschau: wie viele Rahmenwerke blieben mit den bisherigen Angaben?
  const backup = state.q; state.q = draft;
  const cnt = visibleFrameworks().length;
  state.q = backup;

  return `<div class="scrim" data-modal="close">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${L()==="de"?"Fragebogen":"Questionnaire"}"
         data-stop="1">
      <div class="mhead">
        <div class="progress">${QUESTIONS.map((_,k)=>
          `<i class="${k<i?"done":(k===i?"now":"")}"></i>`).join("")}</div>
        <div class="row">
          <span class="lbl">${L()==="de"?`Frage ${i+1} von ${QUESTIONS.length}`:`Question ${i+1} of ${QUESTIONS.length}`}</span>
          <span class="grow"></span>
          <button type="button" class="lbl" data-modal="close">${L()==="de"?"schließen ×":"close ×"}</button>
        </div>
        <h2>${tx(q.q)}</h2>
      </div>
      <div class="mbody">
        <div class="opts ${q.o.length>4?"two":""}">
          ${q.o.map(o=>`<button type="button" class="opt ${q.multi?"":"radio"}"
             data-ans="${q.key}" data-v="${o.v}" data-multi="${!!q.multi}" aria-pressed="${on(o.v)}">
            <span class="tick"></span><span>${tx(o.l)}</span></button>`).join("")}
        </div>
        <div class="why"><b>${L()==="de"?"Warum wir das fragen":"Why we ask"}</b>${tx(q.why)}</div>
      </div>
      <div class="mfoot">
        <button type="button" class="btn sm" data-step="back" ${i===0?"disabled style=opacity:.4":""}>
          ${L()==="de"?"Zurück":"Back"}</button>
        <span class="livecount">${cnt} ${L()==="de"?"Rahmenwerke passen":"frameworks match"}</span>
        <span class="grow"></span>
        <button type="button" class="btn sm ghost" data-step="skip">${L()==="de"?"überspringen":"skip"}</button>
        <button type="button" class="btn primary sm" data-step="${i===QUESTIONS.length-1?"done":"next"}">
          ${i===QUESTIONS.length-1?(L()==="de"?"Filter anwenden":"Apply filter"):(L()==="de"?"Weiter":"Next")}</button>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  document.documentElement.lang = L();
  document.getElementById("proto-txt").textContent = L()==="de"
    ? "Wireframe mit Beispieldaten — Dokumente, Daten und Zusammenfassungen sind erfunden und keine regulatorische Auskunft."
    : "Wireframe with sample data — documents, dates and summaries are fabricated and are not regulatory advice.";
  document.getElementById("app").innerHTML =
    !state.provider ? viewHero() : (state.fw ? viewDetail() : viewBoard());
  document.getElementById("modal-root").innerHTML = viewModal();
}

/* ============================================================
   INTERAKTION
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target;

  const lang = t.closest("[data-lang]");
  if (lang){
    state.lang = lang.dataset.lang;
    document.querySelectorAll("[data-lang]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
    return render();
  }

  if (t.closest("[data-noop]")){ e.preventDefault(); return; }

  const pick = t.closest("[data-pick]");
  if (pick){ state.provider = pick.dataset.pick; state.topics = []; state.fw = null;
    window.scrollTo({top:0}); return render(); }

  if (t.closest("[data-home]")){
    state.provider = null; state.q = null; state.fw = null; state.topics = [];
    window.scrollTo({top:0}); return render(); }

  if (t.closest("[data-board]")){ state.fw = null; window.scrollTo({top:0}); return render(); }

  const jump = t.closest("[data-topicjump]");
  if (jump){ state.fw = null; state.topics = [jump.dataset.topicjump];
    window.scrollTo({top:0}); return render(); }

  const topic = t.closest("[data-topic]");
  if (topic){
    const id = topic.dataset.topic;
    if (id === "ALL") state.topics = [];
    else {
      const at = state.topics.indexOf(id);
      at >= 0 ? state.topics.splice(at,1) : state.topics.push(id);
    }
    return render();
  }

  const fw = t.closest("[data-fw]");
  if (fw){ state.fw = fw.dataset.fw; window.scrollTo({top:0}); return render(); }

  const rm = t.closest("[data-rmf]");
  if (rm){
    const [k,v] = rm.dataset.rmf.split(":");
    const cur = state.q[k];
    if (Array.isArray(cur)) state.q[k] = cur.filter(x => x !== v);
    else state.q[k] = null;
    if (!activeFilters().length) state.q = null;
    return render();
  }
  if (t.closest("[data-reset]")){ state.q = null; return render(); }

  const md = t.closest("[data-modal]");
  if (md){
    if (md.dataset.modal === "open"){ state.modal = true; state.step = 0; state.q = state.q || {}; }
    else if (md === t || t.closest(".scrim") === md){   // nur Klick auf den Hintergrund
      if (!t.closest("[data-stop]")) { state.modal = false; if (!activeFilters().length) state.q = null; }
    }
    return render();
  }

  const ans = t.closest("[data-ans]");
  if (ans){
    const k = ans.dataset.ans, v = ans.dataset.v;
    state.q = state.q || {};
    if (ans.dataset.multi === "true"){
      const arr = state.q[k] || (state.q[k] = []);
      const at = arr.indexOf(v);
      at >= 0 ? arr.splice(at,1) : arr.push(v);
    } else {
      state.q[k] = state.q[k] === v ? null : v;
    }
    return render();
  }

  const step = t.closest("[data-step]");
  if (step){
    const a = step.dataset.step;
    if (a === "back" && state.step > 0) state.step--;
    else if ((a === "next" || a === "skip") && state.step < QUESTIONS.length - 1) state.step++;
    else if (a === "done" || a === "skip"){
      state.modal = false;
      if (!activeFilters().length) state.q = null;
      window.scrollTo({top:0,behavior:"smooth"});
    }
    return render();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.modal){
    state.modal = false;
    if (!activeFilters().length) state.q = null;
    render();
  }
});

render();
</script>
